name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, vet, modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      # Also checks formatting (goimports) and that every package compiles.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    name: Test (Go ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go that go.mod allows, and the newest release.
        include:
          - name: go.mod minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      - name: Test
        run: go test -count=1 -coverprofile=coverage.out ./...

      # Memory measurement tests skip themselves here.
      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Report coverage
        if: matrix.name == 'stable'
        run: |
          go tool cover -func=coverage.out > coverage.txt
          total=$(tail -1 coverage.txt | awk '{print $NF}')
          echo "Total coverage: $total"
          echo "### Test coverage: $total" >> "$GITHUB_STEP_SUMMARY"

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: stable
          go-package: ./...

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # buf drives protoc-gen-go, which go.mod pins as a tool.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.73.0

      - name: Check proto/*.pb.go match the .proto sources
        run: |
          buf generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::Generated code is out of date. Run 'buf generate' and commit the result."
            exit 1
          fi
